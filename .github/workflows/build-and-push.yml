name: Build and Push Docker Image

# هذا الجزء يحدد متى يعمل هذا الـ Action
on:
  push:
    branches:
      - main # سيتم التشغيل فقط عند الرفع على فرع main

jobs:
  build:
    runs-on: ubuntu-latest # الخادم الذي سيقوم بالبناء

    steps:
      # 1. سحب الكود المصدري من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تسجيل الدخول إلى Docker Hub باستخدام الأسرار التي أضفناها
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. إعداد أداة بناء Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. بناء الصورة ورفعها إلى Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # تذكري تغيير الاسم هنا ليطابق حسابك
          tags: your_username/oxygen-backend:latest
